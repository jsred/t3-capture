name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Sin --with-deps: la imagen de Ubuntu ya trae las bibliotecas de Chrome
      # y así no dependemos de los mirrors de apt.
      - run: npx playwright install chromium
      - run: npm run test:dom
      - name: End-to-end en Chromium (dist/chrome)
        run: npm run test:chrome
      - name: End-to-end en Firefox (.xpi)
        run: FIREFOX_BIN="$(which firefox)" GECKODRIVER="$(which geckodriver)" npm run test:firefox
